name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust_adblock"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "wyzie.apiKey=${{ secrets.WYZIE_API_KEY }}" >> local.properties

      # ---- mpv 播放引擎(已下载视频用): 编译 mpv-android 官方的原生库, 只编 arm64,
      # 和项目现在的 -PABI_FILTERS=arm64-v8a 保持一致 ----
      - name: Install packages for mpv
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm ccache
          sudo pip3 install --break-system-packages meson

      - name: Cache mpv native prefix
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: mpv-native/buildscripts/prefix
          key: mpv-prefix-arm64-${{ hashFiles('mpv-native/buildscripts/include/depinfo.sh', 'mpv-native/buildscripts/scripts/**') }}

      # 编译对象缓存: 第一次从零编译用不上(缓存是空的), 但只要这次编译失败过要重跑,
      # 或者以后随便改一行跟 mpv 无关的代码触发了 workflow, 已经编过的目标文件可以直接复用。
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: mpv-ccache-arm64-${{ github.run_id }}
          restore-keys: |
            mpv-ccache-arm64-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Build mpv native libs (arm64)
        run: |
          cd mpv-native/buildscripts
          chmod +x *.sh include/*.sh scripts/*.sh
          export WGET="wget --progress=dot:giga"
          mkdir -p sdk
          ln -sfn "$ANDROID_HOME" sdk/android-sdk-linux
          IN_CI=1 ./include/download-sdk.sh
          if [ ! -f prefix/arm64/lib/libmpv.so ]; then
            IN_CI=1 ./include/download-deps.sh
            mkdir -p deps/mpv
            $WGET https://github.com/mpv-player/mpv/archive/master.tar.gz -O master.tgz
            tar -xzf master.tgz -C deps/mpv --strip-components=1
            rm master.tgz
            ./buildall.sh --only-deps mpv --arch arm64
          fi
          mkdir -p deps/mpv
          if [ -z "$(ls -A deps/mpv 2>/dev/null)" ]; then
            $WGET https://github.com/mpv-player/mpv/archive/master.tar.gz -O master.tgz
            tar -xzf master.tgz -C deps/mpv --strip-components=1
            rm master.tgz
          fi
          ./buildall.sh -n mpv --arch arm64

      - name: Build libplayer.so (mpv JNI)
        run: |
          NDK="$GITHUB_WORKSPACE/mpv-native/buildscripts/sdk/android-ndk-r30"
          PREFIX64="$GITHUB_WORKSPACE/mpv-native/buildscripts/prefix/arm64" \
          "$NDK/ndk-build" -C mpv-native/src -j"$(nproc)" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            NDK_OUT="$GITHUB_WORKSPACE/mpv-native/src/obj"
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Strip mpv native libraries (shrink APK size)
        run: |
          # app/build.gradle.kts 里有 keepDebugSymbols.add("**/*.so"), 那是专门为了
          # youtubedl-android 把 python/ffmpeg 可执行文件伪装成 .so 保留的, 不能动它,
          # 不然下载功能可能出问题。所以在这里提前把咱们自己编的 mpv/ffmpeg 库瘦身,
          # 等 Gradle 打包的时候这些文件已经没有调试符号可保留了, 不受那条规则影响。
          STRIP="$GITHUB_WORKSPACE/mpv-native/buildscripts/sdk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          DIR="app/src/main/jniLibs/arm64-v8a"
          for so in libswresample.so libpostproc.so libavutil.so libavcodec.so \
                    libavformat.so libswscale.so libavfilter.so libavdevice.so \
                    libmpv.so libplayer.so; do
            if [ -f "$DIR/$so" ]; then
              echo "stripping $so: $(du -h "$DIR/$so" | cut -f1) -> "
              "$STRIP" --strip-unneeded "$DIR/$so"
              echo "  $(du -h "$DIR/$so" | cut -f1)"
            fi
          done
          du -sh app/src/main/jniLibs/arm64-v8a

      - name: Build Debug APK (arm64-v8a only)
        run: ./gradlew assembleDebug -PABI_FILTERS=arm64-v8a --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
